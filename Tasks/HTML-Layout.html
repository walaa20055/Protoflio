<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }

    header, footer {
      background: #2c3e50;
      color: #fff;
      text-align: center;
      padding: 15px;
    }

    nav {
      background: #16a085;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    article {
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    aside {
      background: #ffffff;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
    }

    footer {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Website Page</h1>
    <p>Walaa Saeed</p>
  </header>

  <nav>
    <a href="#"> Home</a>
    <a href="#"> About</a>
    <a href="#"> Contact</a>
  </nav>

  <main>
    <section>
      <article>
        <h2>About Me</h2>
        <p>This page has a different layout [HTML5 structural elements].</p>
      </article>

      <article>
        <h2>My Goals</h2>
        <p>I want to learn Web Development.</p>
      </article>
    </section>

    <aside>
      <h3>Languages I learn</h3>
      <p>HTML CSS JS JAVA.</p>
    </aside>
  </main>

  <footer>
    <p>&copy; 2025 My Website</p>
  </footer>
</body>
</html>
